[package]
name = "vikshep-backend"
version = "0.1.0"
edition = "2021"
description = "Vikshep thin launcher: ensures POSIX shm dir, then execs omnipulse-mcp."

[dependencies]
omnipulse-mcp = "0.1"

# ---------------------------------------------------------------------------
# Local development override for the private engine repo.
# Requires access to samvardhan03/vikshep-engine.
# Uncomment when building against a local checkout:
# ---------------------------------------------------------------------------
# [patch.crates-io]
# omnipulse-mcp = { path = "<path-to-vikshep-engine>/omnipulse-rs/crates/omnipulse-mcp" }
