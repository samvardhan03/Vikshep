[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vikshep-ingest"
version = "0.2.0"
description = "Vikshep ingest service — Geant4 Direct Interface, loader plugins, POSIX shm staging."
requires-python = ">=3.10"
dependencies = [
    "omnipulse-agent",
    "uproot>=5",
    "awkward>=2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2",
    "scikit-learn>=1.3",
    "fastapi",
    "uvicorn",
    "h5py>=3",
]

[project.scripts]
"vikshep-ingest" = "vikshep_ingest.cli.ingest_g4:dispatch"
"vikshep-recipe" = "vikshep_ingest.cli.recipe:main"

[project.entry-points."vikshep.loaders"]
root-uproot = "vikshep_ingest.loaders.root_uproot:RootUprootLoader"
hdf5        = "vikshep_ingest.loaders.hdf5_loader:Hdf5Loader"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
