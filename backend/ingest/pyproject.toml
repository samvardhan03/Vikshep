[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vikshep-ingest"
version = "0.3.0"
description = "Vikshep ingest service — Geant4 Direct Interface, loader plugins, POSIX shm staging."
requires-python = ">=3.10"
dependencies = [
    "uproot>=5",
    "awkward>=2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2",
    "scikit-learn>=1.3",
    "fastapi",
    "uvicorn",
    "h5py>=3",
]

[project.optional-dependencies]
# Scattering extra: requires a Rust toolchain (rustup + cargo).
# Install: pip install maturin && pip install -e "backend/ingest[scattering]"
# Rust toolchain: curl -sSf https://sh.rustup.rs | sh -s -- -y
scattering = [
    "vikshep-compute @ git+https://github.com/samvardhan03/vikshep-compute@b55468bbb2fb8d1225fa3563e94addfe642b3d5a#subdirectory=crates/vikshep-py",
]

[project.scripts]
"vikshep-ingest" = "vikshep_ingest.cli.ingest_g4:dispatch"
"vikshep-recipe" = "vikshep_ingest.cli.recipe:main"

[project.entry-points."vikshep.loaders"]
root-uproot = "vikshep_ingest.loaders.root_uproot:RootUprootLoader"
hdf5        = "vikshep_ingest.loaders.hdf5_loader:Hdf5Loader"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
