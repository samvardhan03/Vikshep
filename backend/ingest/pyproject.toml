[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vikshep-ingest"
version = "0.4.1"
description = "Vikshep Geant4 Direct Interface: Geant4 CSV to deterministic scattering features, calibration and DisCo-decorrelated tagging"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Samvardhan Singh" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "uproot>=5",
    "awkward>=2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2",
    "scikit-learn>=1.3",
    "fastapi",
    "uvicorn",
    "h5py>=3",
    # The open deterministic core, exact version (results depend on it), on the
    # platforms with prebuilt wheels.  Elsewhere the CLI falls back to
    # per-event aggregates and says so; the extra below forces the core.
    'vikshep-compute==0.1.0; (sys_platform == "linux" and (platform_machine == "x86_64" or platform_machine == "aarch64")) or sys_platform == "darwin" or (sys_platform == "win32" and platform_machine == "AMD64")',
]

[project.optional-dependencies]
scattering = ["vikshep-compute==0.1.0"]
# Reading vikshep-sim output folders (hits.arrow, Arrow IPC): vikshep-ingest sim
sim = ["pyarrow>=14"]

[project.urls]
Homepage = "https://vikshep.vercel.app"
Repository = "https://github.com/samvardhan03/Vikshep"
"Open core" = "https://github.com/samvardhan03/vikshep-compute"

[project.scripts]
"vikshep-ingest" = "vikshep_ingest.cli.ingest_g4:dispatch"
"vikshep-recipe" = "vikshep_ingest.cli.recipe:main"

[project.entry-points."vikshep.loaders"]
root-uproot = "vikshep_ingest.loaders.root_uproot:RootUprootLoader"
hdf5        = "vikshep_ingest.loaders.hdf5_loader:Hdf5Loader"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
