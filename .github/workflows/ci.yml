name: CI

on:
  push:
    branches: ["main", "feat/**", "chore/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  agent:
    name: Agent (bun test + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: bun test (agent)
        working-directory: agent
        run: bun test
      - name: tsc (agent)
        working-directory: agent
        run: bunx tsc --noEmit

  site:
    name: Site build (bun run build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build site
        working-directory: site
        run: bun run build

  python:
    name: Python tests without the open core (aggregates fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install vikshep-ingest, then remove the core to test the fallback
        run: |
          pip install pytest -e "backend/ingest[sim]"
          pip uninstall -y vikshep-compute
      - name: Run tests
        run: python -m pytest backend/ingest/tests/ -v

  python-scattering:
    name: Python tests with scattering extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout vikshep-compute at pinned commit
        run: |
          git clone https://github.com/samvardhan03/vikshep-compute.git vikshep-compute
          cd vikshep-compute && git checkout b55468bbb2fb8d1225fa3563e94addfe642b3d5a
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install vikshep-ingest[scattering] (open core from PyPI)
        run: |
          pip install pytest
          pip install -e "backend/ingest[scattering,sim]"
      - name: Build vikshep-mcp
        run: cargo build --release -p vikshep-mcp
        working-directory: vikshep-compute
      - name: Run all Python tests (including scattering)
        run: python -m pytest backend/ingest/tests/ -v
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run agent integration test
        working-directory: agent
        run: |
          bun install
          VIKSHEP_MCP_BIN=${{ github.workspace }}/vikshep-compute/target/release/vikshep-mcp \
            bun test tests/mcp-integration.test.ts

  quickstart-golden:
    name: Quickstart golden-hash check (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install vikshep-ingest (open core from PyPI, as a user would)
        run: pip install -e backend/ingest
      - name: Ingest sample CSV
        run: |
          START_MS=$(python3 -c "import time; print(int(time.time()*1000))")
          vikshep-ingest g4 examples/g4_quickstart/sample.csv --schema komal_v1
          END_MS=$(python3 -c "import time; print(int(time.time()*1000))")
          echo "ingest_ms=$((END_MS - START_MS))" >> "$GITHUB_STEP_SUMMARY"
      - name: Calibrate
        run: |
          vikshep-recipe calibrate \
            --features examples/g4_quickstart/manifest.json \
            --target true_energy \
            --feature-set scattering \
            --out examples/g4_quickstart/
      - name: Tag
        run: |
          vikshep-recipe tag \
            --features examples/g4_quickstart/manifest.json \
            --label    is_signal \
            --protect  true_energy \
            --weights  weight \
            --lambda   1.0 \
            --feature-set scattering \
            --out examples/g4_quickstart/
          END_MS=$(python3 -c "import time; print(int(time.time()*1000))")
          echo "TTFV measured on ${{ matrix.os }} (Python 3.11, vikshep-compute 0.1.0 from PyPI)"
      - name: Compute golden hashes
        run: python scripts/compute_golden_hash.py
      - uses: actions/upload-artifact@v4
        with:
          name: golden-hashes-${{ matrix.os }}
          path: golden/

  compare-golden:
    name: Compare golden hashes across platforms
    needs: quickstart-golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: golden-hashes-*
          path: golden/
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare hashes
        run: python scripts/compare_golden_hashes.py

  boundaries:
    name: Boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-boundaries.sh
        run: bash scripts/check-boundaries.sh

  build-wheel:
    name: Build vikshep-ingest wheel (artifact only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          pip install build
          python -m build backend/ingest --outdir dist/
      - uses: actions/upload-artifact@v4
        with:
          name: vikshep-ingest-wheel
          path: dist/
